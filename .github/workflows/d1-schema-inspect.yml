name: D1 Schema Inspect

on:
  workflow_dispatch:
    inputs:
      database_name:
        description: Cloudflare D1 database name or UUID to inspect
        required: true
        type: string
      target_environment:
        description: Environment label used only for artifact naming
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production

permissions:
  contents: read

concurrency:
  group: d1-schema-inspect-${{ github.ref }}-${{ inputs.target_environment }}
  cancel-in-progress: true

jobs:
  inspect:
    name: Inspect D1 schema
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      D1_SCHEMA_REPORT_DIR: d1-schema-report
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID repository secret is required."; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN repository secret is required."; exit 1; }

      - name: Validate D1 inspect target
        env:
          DATABASE_NAME: ${{ inputs.database_name }}
        run: |
          node --input-type=module <<'NODE'
          const value = process.env.DATABASE_NAME ?? '';
          if (!/^[a-zA-Z0-9_-]{1,128}$/.test(value)) {
            console.error('database_name must be a D1 database name or UUID containing only letters, numbers, underscore, or hyphen.');
            process.exit(1);
          }
          NODE

      - name: Capture sqlite_master
        run: |
          mkdir -p "$D1_SCHEMA_REPORT_DIR"
          pnpm dlx wrangler@4.20.5 d1 execute "${{ inputs.database_name }}" --remote --json --command "select type, name, tbl_name, sql from sqlite_master where type in ('table', 'index') order by type, name;" > "$D1_SCHEMA_REPORT_DIR/sqlite-master.json"

      - name: Capture table info
        run: |
          set -euo pipefail
          for table in \
            user_points \
            point_transactions \
            daily_point_claims \
            chat_room_reads \
            chat_room_exits \
            user_blocks \
            reports \
            request_gates \
            revoked_profiles \
            user_suspensions \
            recent_users \
            talk_posts \
            chat_rooms \
            chat_messages \
            my_rooms
          do
            pnpm dlx wrangler@4.20.5 d1 execute "${{ inputs.database_name }}" --remote --json --command "pragma table_info($table);" > "$D1_SCHEMA_REPORT_DIR/table-info-$table.json"
          done

      - name: Check captured schema report
        run: pnpm check:d1-schema-report

      - name: Upload schema report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-schema-${{ inputs.target_environment }}
          path: d1-schema-report
          if-no-files-found: error
