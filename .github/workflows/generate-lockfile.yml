name: Generate pnpm Lockfile

on:
  push:
    branches: [main]
    paths:
      - .github/lockfile-trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-pnpm-lockfile
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Generate lockfile without lifecycle scripts
        run: pnpm install --lockfile-only --ignore-scripts

      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "pnpm-lock.yaml is already current."
          else
            git commit -m "chore: generate pnpm lockfile"
            git push origin HEAD:main
          fi
