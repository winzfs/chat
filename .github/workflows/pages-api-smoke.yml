name: Pages API Smoke

on:
  workflow_dispatch:
    inputs:
      pages_url:
        description: Cloudflare Pages deployment URL to check, for example https://chat-509.pages.dev
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pages-api-smoke-${{ github.workflow }}-${{ inputs.pages_url }}
  cancel-in-progress: true

jobs:
  api-smoke:
    name: Check deployed API contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate smoke URL
        env:
          PAGES_SMOKE_URL: ${{ inputs.pages_url }}
        run: |
          node -e "const url = new URL(process.env.PAGES_SMOKE_URL); if (url.protocol !== 'https:') throw new Error('pages_url must use https'); if (!url.hostname.endsWith('.pages.dev') && !url.hostname.endsWith('.workers.dev')) throw new Error('pages_url must target a Cloudflare deployment host');"
      - name: Run Pages API smoke check
        env:
          PAGES_SMOKE_URL: ${{ inputs.pages_url }}
        run: node scripts/smoke-pages-api.mjs
