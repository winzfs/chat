name: Web Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check dependency pins
        run: pnpm check:dependency-pins
      - name: Check client contracts
        run: pnpm check:client-contracts
      - name: Check D1 migrations
        run: pnpm check:d1-migrations
      - name: Typecheck web
        run: pnpm typecheck
      - name: Build web
        run: pnpm build
