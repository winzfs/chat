name: Add Playwright Lock

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/add-playwright-lock.yml

permissions:
  contents: write

jobs:
  update-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Add pinned Playwright dependency
        run: pnpm add -Dw --save-exact @playwright/test@latest --lockfile-only --ignore-scripts
      - name: Commit lockfile
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json pnpm-lock.yaml
          git diff --cached --quiet || git commit -m "build: lock Playwright test dependency"
          git push
